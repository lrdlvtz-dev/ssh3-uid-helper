name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu jq shellcheck
      - name: Build daemon
        run: make all
      - name: Go client tests
        run: |
          go test -race src/dial_uid.go src/dial_uid_test.go src/dial_uid_integration_test.go
          go test -run '^$' -fuzz FuzzBuildHelperRequest -fuzztime=5s \
            src/dial_uid.go src/dial_uid_test.go src/dial_uid_integration_test.go
          go test -c -o "$RUNNER_TEMP/dial_uid.test" \
            src/dial_uid.go src/dial_uid_test.go src/dial_uid_integration_test.go
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck -mode=binary "$RUNNER_TEMP/dial_uid.test"
      - name: Static and shell checks
        run: |
          sh tests/test-static.sh
          shellcheck tests/*.sh
          python3 -m py_compile tests/helper_client.py tests/helper_services.py \
            tests/check_ssh3_forwarding.py tests/forwarding_echo.py \
            tests/forwarding_probe.py
      - name: Compile pinned SSH3 integration
        run: ./tests/test-ssh3-integration.sh
      - name: Validate CMXsafe release contract
        run: |
          ./scripts/build_cmxsafe_release.sh 0.1.0-test "$(git rev-parse HEAD)" "$RUNNER_TEMP/cmxsafe-release"
          jq -e '.component == "ssh3-uid-helper" and .protocol.version == 2 and (.artifacts | length) == 2' \
            "$RUNNER_TEMP/cmxsafe-release/cmxsafe-component.json"
          (cd "$RUNNER_TEMP/cmxsafe-release" && sha256sum --check SHA256SUMS)
      - name: Kernel and nftables integration
        run: |
          docker build -t cmxsafe-ssh3-helper-test -f tests/Dockerfile .
          docker run --rm --privileged cmxsafe-ssh3-helper-test
