name: CMXsafe signed helper release

on:
  push:
    tags:
      - 'cmxsafe-helper-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a non-publishing validation build
        required: true
        default: 0.1.0-test

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout compatible CMXsafe SSH3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lrdlvtz-dev/ssh3-cmxsafe
          ref: 6af6213abba46a865d94d36ec33c0e5fb2bdb9d3
          path: ssh3-cmxsafe

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Require release tags to point into main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install release toolchains
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu jq shellcheck

      - name: Verify source before packaging
        shell: bash
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -Wpedantic -o /tmp/cmxsafe-ssh3-helper src/helper_daemon_v2.cpp
          cc -O2 -std=c17 -Wall -Wextra -Werror -Wpedantic -Wconversion -Wshadow -Wformat=2 \
            -o /tmp/cmxsafe-endpointd endpoint/cmxsafe-endpointd.c
          go test -race src/dial_uid.go src/dial_uid_test.go src/dial_uid_integration_test.go
          go test -c -o /tmp/dial_uid.test src/dial_uid.go src/dial_uid_test.go src/dial_uid_integration_test.go
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck -mode=binary /tmp/dial_uid.test
          sh tests/test-static.sh
          make -C endpoint test
          shellcheck scripts/*.sh tests/*.sh

      - name: Verify privileged helper and SSH3 integration
        env:
          SSH3_CMXSAFE_REPO: ${{ github.workspace }}/ssh3-cmxsafe
          SSH3_CMXSAFE_COMMIT: 6af6213abba46a865d94d36ec33c0e5fb2bdb9d3
        run: |
          docker build -t cmxsafe-ssh3-helper-test -f tests/Dockerfile .
          docker run --rm --privileged cmxsafe-ssh3-helper-test
          tests/test-mirror-e2e.sh

      - name: Build reproducible Linux bundles
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          VALIDATION_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${RELEASE_VERSION#cmxsafe-helper-v}"
          else
            version="$VALIDATION_VERSION"
          fi
          ./scripts/build_cmxsafe_release.sh "$version" "$GITHUB_SHA" dist
          ./tests/test-release-contract.sh dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/ssh3-uid-helper.spdx.json
          upload-artifact: false

      - name: Finalize checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz cmxsafe-component.json ssh3-uid-helper.spdx.json > SHA256SUMS

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with GitHub OIDC
        if: github.event_name == 'push'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest release archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh3-uid-helper-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable-input prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace its assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "CMXsafe SSH3 helper and endpoint daemon ${GITHUB_REF_NAME#cmxsafe-helper-v}" \
            --notes "Experimental CMXsafe SSH3 privilege-separation helper and endpoint mirror-address daemon. Both dynamically link to glibc. Verify the Sigstore bundle, GitHub provenance, SBOM, and component manifest before use."
